version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////app/data/claimforge.db
      - STORAGE_MODE=local
      - UPLOAD_DIR=/app/uploads
      - AI_PROVIDER=rule_based
    volumes:
      - claimforge-uploads:/app/uploads
      - claimforge-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  claimforge-uploads:
  claimforge-data:
